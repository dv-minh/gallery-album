name = "gallery-album"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "gallery"
database_id = "2a2aea86-c918-42dc-8c15-48e88fca1f26"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gallery-photos"
