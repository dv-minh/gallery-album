name = "gallery-album"
main = "worker/index.ts"
compatibility_date = "2024-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/img/*"]

[[d1_databases]]
binding = "DB"
database_name = "gallery"
# Sau khi chạy `npx wrangler d1 create gallery`, thay bằng database_id thật.
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "gallery-photos"
